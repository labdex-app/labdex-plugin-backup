id: backup
name: Backup
kind: module
tags: [backup, core]
pages:
  - {id: backups, label: Backups}
version: "1.2"
labdex: ">=1.3,<2"
description: Scheduled backups of the database and inventory to a folder (local disk or a mounted NFS share) or an S3 bucket, encrypted with a passphrase. Secrets in a backup stay encrypted with secret.key, which is never included.
settings:
  - {key: target, label: Where to, type: select, default: folder, options: [folder, s3]}
  - {key: path, label: Folder, type: string, when: {target: folder}, help: "Empty = backups/ in labdex's data folder. For NFS, mount the share into the container and give that path."}
  - {key: s3_endpoint, label: S3 endpoint, type: string, help: "e.g. https://s3.eu-central-1.amazonaws.com or your MinIO / Garage URL", when: {target: s3}}
  - {key: s3_bucket, label: S3 bucket, type: string, when: {target: s3}}
  - {key: s3_region, label: S3 region, type: string, default: us-east-1, when: {target: s3}}
  - {key: s3_prefix, label: S3 key prefix, type: string, default: labdex/, when: {target: s3}}
  - {key: s3_access_key, label: S3 access key, type: secret, when: {target: s3}}
  - {key: s3_secret_key, label: S3 secret key, type: secret, when: {target: s3}}
  - {key: passphrase, label: Encryption passphrase, type: secret, help: "Strongly recommended, required for S3. Without it the backup can't be restored, so store it in your password manager."}
  - {key: keep, label: Keep the newest …, type: int, default: 14, min: 1, max: 1000}
actions:
  - {id: backup, label: Back up now, mode: run, schedulable: true}
  - {id: download, label: Download a fresh backup, mode: export}
endpoints:
  - {id: backups, label: Backups at the target}
widgets:
  - {id: last, label: Last backup, where: dashboard, refresh: 300}
